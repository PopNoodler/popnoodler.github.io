<canvas id="cv"></canvas>
<script>
(function(){
'use strict';
/* BEER IN THE SUN — the game (v7). Unofficial fan tribute to GMCG.
   The story, lived on repeat: chug yer beer in the sun spots o' yer garden ->
   oot the gate tae the Buzy Bee an' pour yer ain pint -> get run over on the
   street on the way hame (on purpose) -> fly hame balancin' the pint -> walk it off. */

var VER='v52';
var W=216,H=384,TAU=Math.PI*2;
var RES=3; /* supersample: art stays chunky, text renders crisp on big screens */
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
cv.width=W*RES;cv.height=H*RES;
var scale=1;
function resize(){
  scale=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=(W*scale)+'px';cv.style.height=(H*scale)+'px';
}
addEventListener('resize',resize);resize();
cv.addEventListener('contextmenu',function(e){e.preventDefault();});

function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function rnd(a,b){return a+Math.random()*(b-a)}
function dist(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1)}
function mix(c1,c2,t){
  t=clamp(t,0,1);
  return 'rgb('+Math.round(lerp(c1[0],c2[0],t))+','+Math.round(lerp(c1[1],c2[1],t))+','+Math.round(lerp(c1[2],c2[2],t))+')';
}

/* ---------- persistence ---------- */
var hi=+(localStorage.bs_hi||0);
var muted=localStorage.bs_mute==='1';
var cutsSeen=+(localStorage.bs_cuts||0);

/* ---------- audio: chiptune fallback + "Beer In The Sun" by GMCG (used with his blessing) ---------- */
var AC=null,master=null,musGain=null,nextStep=0,stepIdx=0;
var STEP=60/130/2; /* eighth notes at 130 BPM, same tempo as the song */
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
    musGain=AC.createGain();musGain.gain.value=0.9;musGain.connect(master);
    nextStep=AC.currentTime+0.1;
    setInterval(musicPump,110);
    initSong();
  }catch(e){AC=null;}
}
function setMuted(m){
  muted=m;localStorage.bs_mute=m?'1':'0';
  if(master)master.gain.value=m?0:1;
}
function tone(freq,t0,dur,type,vol,slideTo,dest){
  if(!AC||muted)return;
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(freq,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(dest||master);
  o.start(t0);o.stop(t0+dur+0.02);
}
function noiseBurst(t0,dur,vol,cutoff){
  if(!AC||muted)return;
  var n=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=AC.createBufferSource();s.buffer=buf;
  var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=cutoff||8000;
  var g=AC.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);
}
/* two-bar sunny loop: lead in C pentatonic over a I-vi-IV-V bass */
var LEAD=[329.63,392,440,0,523.25,0,440,392, 329.63,392,440,523.25,587.33,523.25,440,392,
          659.25,0,587.33,523.25,440,392,440,0, 392,329.63,392,440,392,0,0,0];
var BASS=[130.81,110,174.61,196];
function scheduleStep(i,t){
  if(!songFailed)return; /* the real song owns the soundtrack; chiptune only if it cannae load */
  if(musGain)musGain.gain.setTargetAtTime(rainOnScreen()?0.3:0.9,t,0.3);
  var L=LEAD[i];
  if(L)tone(L,t,0.14,'square',0.045,0,musGain);
  if(i%4===0)tone(BASS[(i>>2)%4],t,0.3,'triangle',0.07,0,musGain);
  if(i%2===1)noiseBurst(t,0.03,muted?0:0.012,9000);
}
function musicPump(){
  if(!AC||muted)return;
  var ahead=AC.currentTime+0.25;
  while(nextStep<ahead){scheduleStep(stepIdx,nextStep);stepIdx=(stepIdx+1)%32;nextStep+=STEP;}
}
function sfx(name){
  if(!AC||muted)return;
  var t=AC.currentTime;
  if(name==='glug'){tone(rnd(150,210),t,0.09,'square',0.05,90);}
  else if(name==='ding'){tone(880,t,0.08,'square',0.06);tone(1318.5,t+0.09,0.14,'square',0.06);}
  else if(name==='swat'){noiseBurst(t,0.06,0.12,3000);tone(220,t,0.08,'square',0.08,60);}
  else if(name==='squawk'){tone(950,t,0.12,'sawtooth',0.05,480);tone(900,t+0.16,0.1,'sawtooth',0.04,430);}
  else if(name==='thunder'){noiseBurst(t,0.7,0.22,320);}
  else if(name==='lose'){tone(320,t,0.42,'square',0.09,70);noiseBurst(t,0.25,0.08,900);}
  else if(name==='start'){[261.63,329.63,392,523.25].forEach(function(f,i){tone(f,t+i*0.07,0.12,'square',0.06);});}
  else if(name==='tier'){tone(523.25,t,0.07,'square',0.05);tone(659.25,t+0.07,0.1,'square',0.05);}
  else if(name==='bliss'){[523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,i){tone(f,t+i*0.06,0.14,'square',0.05);});}
  else if(name==='honk'){[659.25,587.33,523.25].forEach(function(f,i){tone(f,t+i*0.13,0.12,'triangle',0.08);});}
  else if(name==='beep'){tone(880,t,0.1,'square',0.07);tone(880,t+0.13,0.1,'square',0.07);}
  else if(name==='squash'){noiseBurst(t,0.14,0.2,600);tone(95,t,0.3,'square',0.1,40);}
  else if(name==='boot'){noiseBurst(t,0.05,0.15,1200);tone(140,t,0.14,'square',0.09,60);}
  else if(name==='pickup'){tone(659.25,t,0.07,'square',0.05);tone(880,t+0.06,0.09,'square',0.05);}
  else if(name==='spill'){tone(rnd(500,700),t,0.05,'sine',0.03,300);}
  else if(name==='splash'){noiseBurst(t,0.18,0.12,1500);tone(280,t,0.12,'sine',0.06,120);}
  else if(name==='empty'){tone(330,t,0.12,'square',0.06,165);tone(165,t+0.14,0.2,'square',0.06,90);}
  else if(name==='cheer'){noiseBurst(t,0.22,0.09,2500);tone(523.25,t,0.09,'square',0.04);tone(659.25,t+0.08,0.12,'square',0.04);}
  else if(name==='whoosh'){noiseBurst(t,0.35,0.09,3000);tone(200,t,0.6,'sawtooth',0.035,900);}
  else if(name==='boing'){tone(140,t,0.14,'sine',0.09,520);tone(520,t+0.15,0.22,'sine',0.07,180);}
  else if(name==='twinkle'){[1046.5,1318.5,1568].forEach(function(f,i){tone(f,t+i*0.09,0.16,'sine',0.035);});}
  else if(name==='pour'){noiseBurst(t,0.16,0.05,2200);}
  else if(name==='lick'){ /* the cheesy guitar lick */
    tone(392,t,0.1,'sawtooth',0.06,440);
    tone(523.25,t+0.1,0.1,'sawtooth',0.06);
    tone(440,t+0.2,0.09,'sawtooth',0.06);
    tone(392,t+0.29,0.09,'sawtooth',0.06);
    tone(329.63,t+0.38,0.34,'sawtooth',0.07,392);
  }
}

/* ---------- the real thing: "Beer In The Sun" by GMCG, used with his blessing.
   One decoded buffer, two players: the full song sits quietly under the whole
   game, and the bit Graeme picked (2:52-3:15, pre-chorus intae the chorus)
   blooms in loud while ye're staunin' in the sun. Each player keeps its ain
   place and resumes where it left off, wi' quick fades both ways. ---------- */
var SUN_A=172;                      /* 2:52 — start o' the pre-chorus, a doonbeat */
var BAR=(60/130)*4;                 /* one bar at 130 BPM; the grid is anchored at SUN_A */
var SUN_LEN=12*BAR;                 /* the section loops as 12 clean bars */
var SUN_B=SUN_A+SUN_LEN;
var BG_VOL=0.3,SUN_VOL=0.3,CF=0.6;  /* keep these EQUAL — the filter, no' the volume, is the difference */
var STRUT_TAIL=5;                   /* the chorus lingers this lang efter walkin' it aff */
var songBuf=null,bgSrc=null,sunSrc=null,bgGain=null,sunGain=null,bgFilt=null;
var bgPos=0,sunPos=-1,bgT0=0,sunT0=0; /* sunPos -1 = first visit enters at SUN_A */
var sunOn=false,sunHold=0,pend=null,strutCued=false,strutTail=0,songFailed=false; /* pend = a switch waiting for its bar line */
function initSong(){
  if(!AC||bgGain)return;
  /* the background song sits ahint the clouds: low-passed and quiet */
  bgFilt=AC.createBiquadFilter();bgFilt.type='lowpass';bgFilt.frequency.value=1300;bgFilt.Q.value=0.7;
  bgGain=AC.createGain();bgGain.gain.value=0;
  bgFilt.connect(bgGain);bgGain.connect(master);
  sunGain=AC.createGain();sunGain.gain.value=0;sunGain.connect(master);
  fetch('song.mp3').then(function(r){if(!r.ok)throw 0;return r.arrayBuffer();}).then(function(ab){
    AC.decodeAudioData(ab,function(buf){songBuf=buf;if(SUN_B>buf.duration){SUN_B=buf.duration;SUN_LEN=SUN_B-SUN_A;}},function(){songFailed=true;});
  }).catch(function(){songFailed=true; /* nae bother — the chiptune steps in */ });
}
function makeSrc(sun){
  var s=AC.createBufferSource();s.buffer=songBuf;s.loop=true;
  if(sun){s.loopStart=SUN_A;s.loopEnd=SUN_B;s.connect(sunGain);}
  else s.connect(bgFilt);
  return s;
}
function gridSnap(p){return SUN_A+Math.round((p-SUN_A)/BAR)*BAR;}
function activePos(t){
  if(sunOn){var x=((sunPos-SUN_A)+(t-sunT0))%SUN_LEN;if(x<0)x+=SUN_LEN;return SUN_A+x;}
  var b=(bgPos+(t-bgT0))%songBuf.duration;if(b<0)b+=songBuf.duration;return b;
}
/* every switch waits for the next bar line, then crossfades — both layers land on the grid */
function scheduleSwitch(toSun,fresh){
  var t=AC.currentTime,p=activePos(t);
  /* the fade straddles the bar line — half in, half oot, doonbeat in the middle */
  var nb=SUN_A+Math.ceil((p+CF/2+0.12-SUN_A)/BAR)*BAR;
  var at=t+(nb-p)-CF/2;
  var inSrc=makeSrc(toSun),inBar;
  if(toSun){
    inBar=(fresh||sunPos<0)?SUN_A:gridSnap(sunPos);
    if(inBar<SUN_A||inBar>=SUN_B)inBar=SUN_A;
  }else{
    inBar=gridSnap(bgPos)%songBuf.duration;if(inBar<0)inBar+=songBuf.duration;
  }
  var inPos=inBar-CF/2; /* start half a fade early so the doonbeat lands at full presence */
  if(!toSun){inPos%=songBuf.duration;if(inPos<0)inPos+=songBuf.duration;}
  inSrc.start(at,Math.max(0,inPos));
  var inGain=toSun?sunGain:bgGain,outGain=toSun?bgGain:sunGain;
  inGain.gain.cancelScheduledValues(t);
  inGain.gain.setValueAtTime(0.0001,at);
  inGain.gain.linearRampToValueAtTime(toSun?SUN_VOL:BG_VOL,at+CF);
  outGain.gain.cancelScheduledValues(t);
  outGain.gain.setValueAtTime(outGain.gain.value,t);
  outGain.gain.setValueAtTime(outGain.gain.value,at);
  outGain.gain.linearRampToValueAtTime(0.0001,at+CF);
  pend={to:toSun,at:at,src:inSrc,inPos:Math.max(0,inPos),outPos:nb};
}
function finishSwitch(){
  if(pend.to){
    if(bgSrc){try{bgSrc.stop();}catch(e){} bgPos=pend.outPos%songBuf.duration;}
    bgSrc=null;sunSrc=pend.src;sunPos=pend.inPos;sunT0=pend.at;sunOn=true;
  }else{
    if(sunSrc){try{sunSrc.stop();}catch(e){} sunPos=SUN_A+((pend.outPos-SUN_A)%SUN_LEN);}
    sunSrc=null;bgSrc=pend.src;bgPos=pend.inPos;bgT0=pend.at;sunOn=false;
  }
  pend=null;
}
function cancelSwitch(){
  var t=AC.currentTime;
  try{pend.src.stop(t);}catch(e){}
  var inGain=pend.to?sunGain:bgGain,outGain=pend.to?bgGain:sunGain;
  inGain.gain.cancelScheduledValues(t);inGain.gain.setValueAtTime(0.0001,t);
  outGain.gain.cancelScheduledValues(t);
  outGain.gain.setValueAtTime(outGain.gain.value,t);
  outGain.gain.setTargetAtTime(pend.to?BG_VOL:SUN_VOL,t,0.15);
  pend=null;
}
function updSong(dt){
  if(!AC||!songBuf)return;
  var t=AC.currentTime;
  if(!bgSrc&&!sunSrc&&!pend){ /* first start: the song drifts in ahint the clouds */
    bgSrc=makeSrc(false);bgPos=bgPos%songBuf.duration;
    bgSrc.start(0,bgPos);bgT0=t;
    bgGain.gain.setTargetAtTime(BG_VOL,t,0.5);
    return;
  }
  var strutNow=state==='PLAY'&&scene==='STRUT';
  if(strutNow)strutTail=STRUT_TAIL;
  else if(scene!=='GARDEN')strutTail=0;
  else if(strutTail>0)strutTail-=dt;
  var wantSun=strutNow||(state==='PLAY'&&scene==='GARDEN'&&strutTail>0)
    ||(state==='PLAY'&&scene==='GARDEN'&&!fetching&&inSunPatch());
  if(!strutNow)strutCued=false;
  if(pend){
    if(t>pend.at+CF+0.05)finishSwitch();
    else if(wantSun!==pend.to&&t<pend.at-0.08)cancelSwitch();
    else return;
  }
  if(strutNow&&!sunOn&&!strutCued&&!pend){
    scheduleSwitch(true,true);strutCued=true;return; /* walk it aff tae the chorus, fae the tap */
  }
  /* sticky: quick tae bring the chorus in, gey reluctant tae let it go */
  if(sunOn&&!wantSun&&!strutNow&&scene==='GARDEN'&&patch.alpha>0.4&&dist(dude.x,dude.y,patch.x,patch.y)<patch.r+14)wantSun=true;
  if(wantSun!==sunOn){
    sunHold+=dt;
    if(sunHold>(wantSun?0.15:(scene==='GARDEN'?3.5:1.0))){sunHold=0;scheduleSwitch(wantSun);}
  }else sunHold=0;
  if(!sunOn&&bgSrc&&!pend)bgGain.gain.setTargetAtTime(rainOnScreen()?BG_VOL*0.5:BG_VOL,t,0.4);
}

/* ---------- layout: a cooncil hoose back garden ---------- */
var GATE={x:32,y:352};        /* gap in the back fence, bottom-left — aff yer thumb */
var GUITAR={x:82,y:98};       /* his pride an' joy, by the back door */
var WHIRL={x:150,y:216};      /* the whirligig — shelter under the washin' */
var BINS=[{x:17,y:128},{x:38,y:126}];
var FLOWERS={x:28,y:210};

/* ---------- state ---------- */
var state='MENU';                 /* MENU / PLAY / OVER / PAUSE */
var scene='GARDEN';               /* GARDEN / PUB / STREET / CUT / STRUT */
var volTries=0,nawT=0,nawMsg='';  /* the volume slider that says naw */
var fadeV=0,fadeDir=0,fadeNext=null;
var T=0,score=0,menuT=0,overT=0,newBest=false;
var dude={x:108,y:250,tx:108,ty:250,speed:0,vx:0,vy:0,face:1};
var dragging=false,dragId=null,dragOff={x:0,y:0};
var pressStart=null,pressMoved=false;
var kb={l:false,r:false,u:false,d:false};
var pint={has:true,ml:568,watered:0};
var stock=3,fetching=false;
var patch={x:108,y:260,r:34,tx:108,ty:260,alpha:1,moveT:1.2};
var rain={active:false,t:0,nextT:24,warned:false};
var wateredSpoke=false;
var guitarCd=0,bumpCd=0,bumpN=0;
/* the lassies fae the reels — wan tae start, anither every time ye come hame */
var LASS_ROSTER=[
  {baseAng:0.8,towel:'#ff9d3f',bikini:'#ff5252',hair:'#ffd23f'},
  {baseAng:3.6,towel:'#6bc5ff',bikini:'#e86a9a',hair:'#5a3a1e'},
  {baseAng:2.2,towel:'#7ec850',bikini:'#ffd23f',hair:'#c9502e'},
  {baseAng:5.1,towel:'#f0ede4',bikini:'#9a6bb5',hair:'#2b2b30'},
  {baseAng:1.5,towel:'#e8552e',bikini:'#7ec850',hair:'#f0e6d0'},
  {baseAng:4.4,towel:'#ffd23f',bikini:'#6bc5ff',hair:'#8a5a1e'}
];
var LASS_MAX=16;
function makeLassie(i,x,y){
  var c=LASS_ROSTER[i%LASS_ROSTER.length];
  return {x:x,y:y,tx:x,ty:y,state:'dancing',thinkT:rnd(2,4),
    face:Math.random()<0.5?1:-1,baseAng:c.baseAng+i*0.7,
    towel:c.towel,bikini:c.bikini,hair:c.hair};
}
function newLassies(){return [makeLassie(0,60,200)];}
var lassies=newLassies();
function spawnLassie(){
  if(lassies.length>=LASS_MAX)return false;
  var i=lassies.length,c=LASS_ROSTER[i%LASS_ROSTER.length],x=60,y=200;
  for(var tr=0;tr<4;tr++){
    var an=c.baseAng+rnd(-0.9,0.9);
    x=clamp(patch.x+Math.cos(an)*(patch.r+rnd(12,26)),24,W-24);
    y=clamp(patch.y+Math.sin(an)*(patch.r*0.6+rnd(12,24)),132,334);
    if(dist(x,y,dude.x,dude.y)>30)break;
  }
  lassies.push(makeLassie(i,x,y));
  return true;
}
var CUT_LEN=1.2; /* the comic panel — the car, the flight, the word */
var cutT=0,cutWord='',cutBonus=0,cutBig=false,hitCar=null;
/* THE WAY HAME: pint on yer palm, drag tae keep yer haun under it */
var BAL_LEN=8;
var balT=0,hx=108,tiltA=0,tiltV=0,balPX=null,brinkT=0;
var pendCorr=0,dudeOff=0,turbT=0.6;
var swayPh=0,hicT=2,lagBuf=0; /* the drink catches up wi' ye */
var gust={t:2.5,warn:0,dir:1,power:0};
var balFail=false,balFailT=0,flights=0;
/* first-timer cards: pause + instructions, safe until yer first walk-off */
var tutDone=localStorage.bs_tut==='1';
var tutCard=null,tutCardT=0,tutSeen={};
var TUTS={
  garden:{title:'YER GARDEN',lines:['DRAG YER CHAIR INTAE','THE SUN SPOT.',"SIT STILL AN' CHUG.",'THE RAIN CANNAE TOUCH','YE IN THE LIGHT.']},
  pub:{title:'THE BUZY BEE',lines:['HOLD = POUR.','STOP AT THE 568 LINE.','3 CHANCES TAE POUR.']},
  street:{title:'TWA PUBS, WAN ROAD',lines:['CHUG AS YE CROSS.','REFILL AT THE ITHER SIDE —','BONUS EVERY CROSSIN\'.','GETTIN\' HIT = YER WAY HAME.','(THAT\'S FINE. WALK IT OFF.)']},
  fly:{title:'THE WAY HAME',lines:['THE PINT IS ON YER HAUN.','SWIPE LEFT / RIGHT TAE','KEEP YER HAUN UNDER IT.','RIDE IT OOT TIL YER HAME.']}
};
function showTut(key){
  if(tutDone||tutSeen[key])return;
  tutSeen[key]=1;tutCard=TUTS[key];tutCardT=0;
}
var strutT=0,strutBeat=0,strutSteps=0,strutTapped=false,strutDir=1,lickT=0;
var pour={ml:0,hold:false,done:false,doneT:0,msg:'',perfect:false,tries:0};
var pourWob=0,pourPh=0,sputT=0,sputNext=3,pourFlow=1;
var lanes=[],homeHintT=0;
/* crossy-roads atween twa pubs: the Buzy Bee an' The Ither Pub */
var streetDir=1,crossings=0,streetT=0,streetRamp=0,swiftHaufs=0;
var shake=0,flashRed=0,flashWhite=0,invuln=0;
var exposure=0,burnCalled=false,sunburn=0;
var callout=null,bubble=null,parts=[],pops=[];
var walkOffs=0,drankMl=0,tidyPints=0;
var blinkT=rnd(2,4),glugT=0,spillSfxT=0,rainSfxT=0,pourSfxT=0;
var hintSun=true,hintStill=true,hintFetch=true;

function rainOnScreen(){
  return rain.active&&(scene==='GARDEN'||scene==='STRUT');
}
/* the drink: never stops climbin' — easy at wan pint, near-impossible in the teens */
function drunkLvl(){return 1-Math.exp(-(drankMl/568)/7);}
function reset(){
  T=0;score=0;overT=0;newBest=false;
  scene='GARDEN';fadeV=0;fadeDir=0;fadeNext=null;
  dude={x:108,y:250,tx:108,ty:250,speed:0,vx:0,vy:0,face:1};
  dragging=false;dragId=null;

/* ---------- garden checks ---------- */
function inShade(){
  /* under the washin' on the whirligig */
  return dist(dude.x,dude.y,WHIRL.x,WHIRL.y-4)<24;
}
function inSunPatch(){
  return scene==='GARDEN'&&patch.alpha>0.6&&dist(dude.x,dude.y,patch.x,patch.y)<patch.r-2&&!inShade();
}
function inRain(){
  /* it rains everywhere the sun isnae */
  return rain.active&&!inSunPatch()&&!inShade();
}

/* ---------- movement (garden + street) ---------- */
function updMove(dt){
  var maxSp=85;
  var txv=0,tyv=0;
  if(dragging){
    var dx=dude.tx-dude.x,dy=dude.ty-dude.y,d=Math.hypot(dx,dy)||1;
    var sp=Math.min(maxSp,d*8);
    if(d>2){txv=dx/d*sp;tyv=dy/d*sp;}
  }else{
    var kx=(kb.r?1:0)-(kb.l?1:0),ky=(kb.d?1:0)-(kb.u?1:0);
    if(kx||ky){var kd=Math.hypot(kx,ky)||1;txv=kx/kd*maxSp;tyv=ky/kd*maxSp;}
  }
  dude.vx+=(txv-dude.vx)*Math.min(1,dt*10);
  dude.vy+=(tyv-dude.vy)*Math.min(1,dt*10);
  var by1=scene==='STREET'?80:116,by2=scene==='STREET'?H-18:344;
  dude.x=clamp(dude.x+dude.vx*dt,16,W-16);
  dude.y=clamp(dude.y+dude.vy*dt,by1,by2);
  dude.speed=Math.hypot(dude.vx,dude.vy);
  if(Math.abs(dude.vx)>8)dude.face=dude.vx>0?1:-1;
  if(scene==='GARDEN'){
    /* dinnae trample the flooers, the bins — or the lassies */
    var solids=[{x:FLOWERS.x,y:FLOWERS.y,r:15},{x:BINS[0].x,y:BINS[0].y,r:11},{x:BINS[1].x,y:BINS[1].y,r:11},{x:WHIRL.x,y:WHIRL.y+4,r:6}];
    for(var li=0;li<lassies.length;li++)
      solids.push({x:lassies[li].x,y:lassies[li].y,r:lassies[li].state==='dancing'?11:8,lass:true});
    for(var i=0;i<solids.length;i++){
      var sb=solids[i],dx2=dude.x-sb.x,dy2=dude.y-sb.y,d2=Math.hypot(dx2,dy2)||1;
      if(d2<sb.r+8){
        dude.x=sb.x+dx2/d2*(sb.r+8);dude.y=sb.y+dy2/d2*(sb.r+8);
        if(sb.lass&&bumpCd<=0){
          bumpCd=5;
          speak(['PARDON.','SORRY. COMIN\' THROUGH.','AWFY SORRY.'][bumpN%3]);bumpN++;
        }
      }
    }
  }
  if(dude.speed>40&&Math.random()<dt*10)
    parts.push({x:dude.x-dude.face*8,y:dude.y+12,vx:rnd(-8,8),vy:-rnd(4,12),t:0.35,life:0.35,col:'#c9bfa8',sz:1});
  /* slosh: rushing spills yer pint */
  if(pint.has&&pint.ml>0&&dude.speed>45){
    var spill=(dude.speed-45)*0.5*dt;
    pint.ml=Math.max(0,pint.ml-spill);
    if(Math.random()<dt*8){
      parts.push({x:dude.x+rnd(-4,4),y:dude.y-14,vx:rnd(-20,20),vy:rnd(10,40),t:0.4,life:0.4,col:'#e8a020',sz:1});
      spillSfxT-=dt;if(spillSfxT<=0){spillSfxT=0.3;sfx('spill');}
    }
  }
}

/* ---------- garden: drinking ---------- */
function updDrink(dt){
  if(fetching){
    /* oot the back gate tae the pub */
    if(dude.x<62&&dude.y>330)goScene('PUB');
    return;
  }
  if(pint.has&&pint.ml<=0){
    fetching=true;sfx('empty');
    calloutMsg('GET THE BEERS IN!','#ffd23f');
    if(hintFetch)speak('TAE THE BUZY BEE!');
    return;
  }
  var sunny=inSunPatch();
  var still=clamp(1-dude.speed/50,0,1);
  var drinking=sunny&&still>0.05&&pint.has&&pint.ml>0;
  if(drinking){
    var sip=Math.min(pint.ml,95*still*dt);
    pint.ml-=sip;drankMl+=sip;
    score+=sip;
    if(hintStill&&drankMl>150)hintStill=false;
    if(hintSun){hintSun=false;speak('AH... BLISS');}
    glugT-=dt;
    if(glugT<=0){glugT=0.24;sfx('glug');
      parts.push({x:dude.x+dude.face*6+rnd(-2,2),y:dude.y-26,vx:rnd(-6,6),vy:-rnd(14,26),t:0.5,life:0.5,col:'#fff3c4',sz:1});
    }
    if(Math.random()<dt*2.5)popup(dude.x+rnd(-10,10),dude.y-36,'+95','#ffd23f');
    exposure+=dt;
  }
  if(sunny&&!drinking)exposure+=dt*0.5;
  sunburn=clamp(exposure/170,0,1);
  if(sunburn>0.55&&!burnCalled){burnCalled=true;calloutMsg('FACTOR 50? NAE CHANCE','#ff9d6b');speak("AH'M ROASTIN'");}
  /* oot in the rain, the beer gangs bad (only if there's beer in it) */
  if(inRain()&&pint.has&&pint.ml>0){
    pint.watered+=dt/4;
    if(!tutDone)pint.watered=Math.min(pint.watered,0.9); /* safe first run */
    if(pint.watered>0.6&&!wateredSpoke){wateredSpoke=true;speak("MA PINT'S GAUN WATERY!");}
    if(pint.watered>=1)ruinPint("DROONED! PURE RAINWATTER!","AW NAW");
  }else{
    pint.watered=Math.max(0,pint.watered-dt/3);
    if(pint.watered<0.3)wateredSpoke=false;
  }
}

/* ---------- garden: the sun fighting through the clouds ---------- */
function updPatch(dt){
  var R=clamp(T/150,0,1);
  patch.r=lerp(34,24,R);
  patch.moveT-=dt;
  if(patch.moveT<=0){
    patch.tx=rnd(36,180);patch.ty=rnd(132,324);
    patch.moveT=rnd(lerp(5,3,R),lerp(8,5,R));
  }
  var sp=lerp(22,40,R);
  var dx=patch.tx-patch.x,dy=patch.ty-patch.y,d=Math.hypot(dx,dy)||1;
  if(d>2){patch.x+=dx/d*Math.min(sp,d*2)*dt;patch.y+=dy/d*Math.min(sp,d*2)*dt;}
  /* the sun is ALWAYS there — it just wanders */
  patch.alpha=Math.min(1,patch.alpha+dt*2);
}
function updRain(dt){
  var R=clamp(T/150,0,1);
  if(rain.active){
    rain.t-=dt;
    if(rain.t<=0){
      rain.active=false;rain.warned=false;
      rain.nextT=rnd(lerp(24,15,R),lerp(36,24,R));
      if(state==='PLAY'&&scene==='GARDEN'&&Math.random()<0.7)speak("THAT'S IT AFF.");
    }
  }else{
    rain.nextT-=dt;
    if(rain.nextT<=1.5&&!rain.warned){
      rain.warned=true;
      sfx('thunder');flashWhite=0.2;
      if(state==='PLAY'&&scene==='GARDEN'){calloutMsg("RAIN COMIN'!",'#6bc5ff');speak('AW NAW. RAIN.');}
    }
    if(rain.nextT<=0){
      rain.active=true;rain.t=rnd(lerp(6,8,R),lerp(9,12,R));
    }
  }
  if(rainOnScreen()){
    rainSfxT-=dt;
    if(rainSfxT<=0){rainSfxT=0.25;if(AC&&!muted)noiseBurst(AC.currentTime,0.22,0.03,1400);}
  }
}

function pintWorldPos(){
  if(scene==='STRUT')return {x:dude.x,y:dude.y-50};
  return {x:dude.x+dude.face*10,y:dude.y-18};
}
/* ---------- the lassies chase the sun ---------- */
function updLassies(dt){
  if(bumpCd>0)bumpCd-=dt;
  for(var i=0;i<lassies.length;i++){
    var g=lassies[i];
    if(g.state==='dancing'){
      g.thinkT-=dt;
      if(g.thinkT<=0){
        g.thinkT=rnd(2.5,4.5);
        if(dist(g.x,g.y,patch.x,patch.y)>patch.r+36){
          /* sun's aff — up she gets, towel an' a' */
          var an=g.baseAng+rnd(-0.6,0.6);
          g.tx=clamp(patch.x+Math.cos(an)*(patch.r+rnd(10,22)),24,W-24);
          g.ty=clamp(patch.y+Math.sin(an)*(patch.r*0.6+rnd(10,20)),132,334);
          g.state='walking';
        }
      }
    }else{
      var dx=g.tx-g.x,dy=g.ty-g.y,d=Math.hypot(dx,dy)||1;
      if(d<3){g.state='dancing';g.thinkT=rnd(2.5,4.5);}
      else{g.x+=dx/d*36*dt;g.y+=dy/d*36*dt;g.face=dx>0?1:-1;}
    }
  }
}
function drawLassHead(x,y,g){ /* y = tap o' the heid */
  /* side falls, ahint the face */
  ctx.fillStyle=g.hair;
  ctx.fillRect(x-5,y+2,2,10);ctx.fillRect(x+3,y+2,2,10);
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.fillRect(x-5,y+9,2,3);ctx.fillRect(x+3,y+9,2,3);
  /* face */
  ctx.fillStyle='#f0c8a0';ctx.fillRect(x-4,y+2,8,8);
  /* croon + fringe */
  ctx.fillStyle=g.hair;
  ctx.fillRect(x-5,y-1,10,4);
  ctx.fillRect(x-4,y+3,2.5,1);ctx.fillRect(x+1.5,y+3,2.5,1);
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(x-3,y,3,1);
  /* shades: twa lenses, bridge, glint */
  ctx.fillStyle='#1c1c22';
  ctx.fillRect(x-3,y+4.5,2.5,2);ctx.fillRect(x+0.5,y+4.5,2.5,2);
  ctx.fillStyle='#b8b8c0';ctx.fillRect(x-0.5,y+4.5,1,1);
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillRect(x-2.5,y+4.5,1,1);
  /* neb, blush, lips */
  ctx.fillStyle='rgba(160,100,70,0.5)';ctx.fillRect(x-0.5,y+7,1,1);
  ctx.fillStyle='rgba(232,106,154,0.35)';
  ctx.fillRect(x-3.5,y+7,1.5,1);ctx.fillRect(x+2,y+7,1.5,1);
  ctx.fillStyle='#d4607a';ctx.fillRect(x-1,y+8.5,3,1.5);
}
function drawLassie(g){
  ctx.save();ctx.translate(g.x,g.y);
  if(g.state==='walking'){
    if(g.face<0)ctx.scale(-1,1);
    var stp=Math.sin(T*13)*2;
    drawLassHead(0,-28,g);
    px(-4,-18,8,12,'#f0c8a0');          /* torso — tummy an' a' */
    px(-4,-17,8,3,g.bikini);            /* tap */
    px(0,-11,1,1,'rgba(160,100,70,0.8)');  /* belly button */
    px(-4,-9,8,3,g.bikini);             /* bottoms */
    px(-4+stp,-6,3,8,'#f0c8a0');px(1-stp,-6,3,8,'#f0c8a0');
    px(5,-16,7,5,g.towel);              /* towel rolled under her airm */
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.fillRect(5,-14,7,1);
  }else{
    /* dancin' on her towel, like the reels */
    if(g.face<0)ctx.scale(-1,1);
    px(-16,2,32,10,g.towel);
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.fillRect(-16,5,32,2);ctx.fillRect(-16,9,32,2);
    var ph=T*7+g.baseAng*3;
    var sway=Math.sin(ph)*2,kick=Math.sin(ph*0.5)>0?1:0;
    ctx.save();ctx.translate(sway,0);
    px(-4,-6,3,8,'#f0c8a0');px(1,-6+kick,3,8-kick,'#f0c8a0'); /* legs */
    px(-5,-9,10,4,g.bikini);                                   /* bottoms */
    px(-4,-20,8,11,'#f0c8a0');                                 /* tummy */
    px(-4,-18,8,3,g.bikini);                                   /* tap */
    px(0,-12,1,1,'rgba(160,100,70,0.8)');                      /* belly button */
    var aL=Math.sin(ph)>0?3:0,aR=Math.sin(ph+Math.PI)>0?3:0;
    px(-7,-26+aL,2,9,'#f0c8a0');px(5,-26+aR,2,9,'#f0c8a0');    /* airms up */
    drawLassHead(0,-30,g);
    ctx.restore();
    if(Math.floor(T*3+g.baseAng)%4===0)text('♪',13,-26,7,'rgba(255,255,255,0.7)');
  }
  ctx.restore();
}

/* ---------- pub: pour yer ain pint ---------- */
function pourRelease(){
  if(scene!=='PUB'||pour.done||!pour.hold)return;
  pour.hold=false;
  if(pour.ml>=548&&pour.ml<=590){
    pour.done=true;pour.perfect=true;pour.msg='TIDY PINT!';
    pour.ml=568;score+=100;tidyPints++;
    sfx('bliss');popup(W/2,180,'+100','#ffd23f');
    return;
  }
  /* that's a pour used up — three an' ye're done */
  pour.tries++;
  if(pour.tries>=3){
    pour.done=true;pour.msg="THAT'LL DAE.";sfx('ding');
  }
}
function takePartial(){
  if(pour.done||pour.hold||pour.ml<80)return;
  pour.done=true;pour.msg="THAT'LL DAE.";sfx('ding');
}
function updPub(dt){
  if(pour.done){
    pour.doneT+=dt;
    if(pour.doneT>1.2){
      pint.has=true;pint.ml=Math.round(pour.ml);pint.watered=0;fetching=false;hintFetch=false;
      goScene('STREET');pour.done=false;pour.doneT=0;pour.ml=0;
    }
    return;
  }
  if(pour.hold){
    var drunk=drunkLvl();
    pourWob+=dt;
    /* shaky grip: the flow surges an' dribbles */
    var flowMul=1+drunk*(0.7*Math.sin(pourWob*7+pourPh)+0.5*Math.sin(pourWob*13.7));
    if(flowMul<0.12)flowMul=0.12;
    /* an' whiles the tap just stops on ye */
    if(sputT>0){sputT-=dt;flowMul=0;}
    else{
      sputNext-=dt;
      if(drunk>0.1&&sputNext<=0){
        sputT=rnd(0.15,0.45);
        sputNext=rnd(lerp(4,0.7,drunk),lerp(6,1.5,drunk));
        if(Math.random()<0.5)popup(105,150,'PFFT','#cfe6f5');
      }
    }
    pourFlow=flowMul;
    pour.ml+=320*flowMul*dt;
    pourSfxT-=dt;
    if(pourSfxT<=0&&flowMul>0.2){pourSfxT=0.18;sfx('pour');}
    if(pour.ml>590){ /* ower the line — that's it feenished */
      pour.hold=false;
      pour.done=true;pour.msg='OWER THE TAP! WASTED SOME';pour.ml=480;
      sfx('splash');
      for(var i=0;i<10;i++)parts.push({x:rnd(88,140),y:rnd(240,260),vx:rnd(-30,30),vy:-rnd(10,50),t:0.6,life:0.6,col:'#fff8e0',sz:2});
    }
  }
}

/* ---------- street: get yersel run ower ---------- */
function spawnCar(l){

  var wCar=type==='whippy'?44:type==='taxi'?30:26;
  var spd=lerp(90,165,streetRamp)*rnd(0.85,1.15)*(type==='whippy'?0.85:1);
  l.cars.push({x:l.dir>0?-wCar:W+wCar,vx:l.dir*spd,type:type,w:wCar,
    col:['#e86a5a','#6bc5ff','#7ec850','#e8c020'][Math.floor(rnd(0,4))]});
  if(Math.abs(dude.y-l.y)<20)sfx(type==='whippy'?'honk':'beep');
}
function arrivePub(){
  crossings++;swiftHaufs++;
  var bonus=100*crossings;
  score+=bonus;
  pint.has=true;pint.ml=568;pint.watered=0;
  calloutMsg('TAPPED UP! +'+bonus,'#ffd23f');
  speak(streetDir>0?'SWIFT HAUF AT THE ITHER PUB.':'ANITHER WAN AT THE BUZY BEE.');

  dude.tx=dude.x;dude.ty=dude.y;
}
function updStreet(dt){
  updMove(dt);
  homeHintT+=dt;
  streetT+=dt;
  /* chuggin' as ye go — but only doon tae the hauf-wey line */
  if(pint.has&&pint.ml>284){
    var sip=Math.min(pint.ml-284,90*dt);
    pint.ml-=sip;drankMl+=sip;score+=sip;
    glugT-=dt;
    if(glugT<=0){glugT=0.3;sfx('glug');}
  }
  /* crossy-roads ramp: it gets mental fast — ye'll be hit eventually, an' that's fine */
  streetRamp=clamp(streetT/20+crossings*0.15,0,1);
  for(var i=0;i<lanes.length;i++){
    var l=lanes[i];
    l.t-=dt;
    if(l.t<=0){spawnCar(l);l.t=rnd(lerp(3.2,0.55,streetRamp),lerp(4.6,1.15,streetRamp));}
    for(var j=l.cars.length-1;j>=0;j--){
      var c=l.cars[j];
      c.x+=c.vx*dt;
      if((c.vx>0&&c.x>W+50)||(c.vx<0&&c.x<-50)){l.cars.splice(j,1);continue;}
      if(Math.abs(c.x-dude.x)<c.w/2+8&&Math.abs(l.y-dude.y)<17){
        streetHit(c);return;

  }

  if(streetDir>0&&dude.y>262)arrivePub();

function streetHit(c){

/* ---------- cutscene + strut + bliss ---------- */
function updCut(dt){
  cutT+=dt;
  if(cutT>=CUT_LEN){
    scene='BAL';
    sfx('whoosh');
    showTut('fly');
  }
}
function updBal(dt){
  if(balFail){
    balFailT+=dt;
    if(balFailT>1.2){
      balFailT=-999;
      /* spilt it — right back tae the bar wi' ye */
      ruinPint('SPILT THE HAIL PINT!','SAME AGAIN THEN...');
      if(state==='PLAY')goScene('PUB');
    }
    return;
  }
  balT+=dt;
  /* the mair ye've had, the harder this gets — an' it never stops gettin' harder */
  var drunk=drunkLvl();
  /* swipes feed correction directly — nae walls, ye can ayeways steer */
  var kbMove=(kb.r?1:0)-(kb.l?1:0);
  if(kbMove)pendCorr+=kbMove*120*dt;
  var rawApply=clamp(pendCorr,-192*dt,192*dt);
  pendCorr-=rawApply;
  pendCorr*=Math.max(0,1-dt*6); /* stale swipe bleeds aff */
  /* the drunker ye are, the later yer haun answers */
  lagBuf+=rawApply;
  var apply=lagBuf*Math.min(1,dt*lerp(26,4.5,drunk));
  lagBuf-=apply;
  tiltA-=apply/60;
  tiltV*=Math.max(0,1-Math.abs(apply/60)*2); /* corrections settle the swing */
  /* he sways under it, cosmetically */
  dudeOff=clamp(dudeOff+apply*0.45,-34,34);
  dudeOff*=Math.max(0,1-dt*2.2);
  hx=108+dudeOff;
  /* pint physics: it tips — get under it */
  var R=drunk;
  /* body sway — the drink's daein' its ain steerin' */
  tiltV+=Math.sin(balT*1.4+swayPh)*0.8*drunk*dt;
  /* hiccups */
  hicT-=dt;
  if(drunk>0.15&&hicT<=0){
    hicT=rnd(lerp(6,1.2,drunk),lerp(8,2.4,drunk));
    tiltV+=rnd(-1,1)*(0.5+drunk*0.9);
    popup(hx+rnd(-10,10),200,'*HIC*','#ffd23f');
    if(AC&&!muted)tone(rnd(500,700),AC.currentTime,0.08,'square',0.05,900);
    shake=Math.max(shake,2);
  }
  /* ambient turbulence — it's aye daein' somethin' */
  turbT-=dt;
  if(turbT<=0){turbT=rnd(0.5,0.9);tiltV+=rnd(-1,1)*lerp(0.4,0.95,R);}
  /* pow curve: lively near level (yer instinct fires), flattens near the brink */
  var aa=Math.abs(tiltA);
  tiltV+=(tiltA>0?1:tiltA<0?-1:0)*0.6*Math.pow(aa,0.55)*lerp(1.6,2.6,R)*dt;
  tiltV*=Math.max(0,1-dt*0.6);
  /* gusts, telegraphed */
  if(gust.warn>0){
    gust.warn-=dt;
    if(gust.warn<=0){tiltV+=gust.dir*gust.power;sfx('whoosh');}
  }else{
    gust.t-=dt;
    if(gust.t<=0){
      gust.warn=0.6;gust.dir=Math.random()<0.5?-1:1;
      gust.power=lerp(0.77,2.4,R)*rnd(0.8,1.2);
      gust.t=rnd(1.7,2.9);
    }
  }
  tiltA+=tiltV*dt;
  if(!tutDone)tiltA=clamp(tiltA,-0.8,0.8); /* safe first run — cannae tip past the brink */
  tiltA=clamp(tiltA,-1.15,1.15);
  if(Math.abs(tiltA)>0.55&&Math.random()<dt*8)sfx('spill');
  /* the brink: it hings there pourin' — 2 seconds tae save it */
  if(Math.abs(tiltA)>0.92){
    brinkT+=dt;
    if(pint.ml>0)pint.ml=Math.max(0,pint.ml-45*dt);
    if(Math.random()<dt*6)sfx('spill');
    if(brinkT>=0.4){
      balFail=true;balFailT=0;pint.ml=0;
      sfx('splash');shake=6;
      calloutMsg('SPILT IT!!','#ff5252');
      speak('NAW NAW NAW—');
      return;
    }
  }else brinkT=Math.max(0,brinkT-dt*1.5);
  if(balT>=BAL_LEN){
    /* hame, pint intact — noo the strut */
    walkOffs++;score+=100;
    scene='STRUT';
    dude.x=108;dude.y=250;dude.tx=108;dude.ty=250;
    strutT=0;strutBeat=0;strutSteps=0;
    strutDir=1;
    for(var i=0;i<8;i++)parts.push({x:dude.x+rnd(-10,10),y:dude.y+12,vx:rnd(-20,20),vy:-rnd(5,20),t:0.5,life:0.5,col:'#c9bfa8',sz:1});
    popup(dude.x,dude.y-44,"NO' A DROP SPILT +100",'#7ec850');
    calloutMsg('NOO WALK IT OFF!','#ffd23f');
    sfx('cheer');
  }
}
function finishStrut(){
  scene='GARDEN';
  /* hame wi' a fu' pint, aye — nae hauf-measures in yer ain gairden */
  if(pint.has&&pint.ml<560)popup(dude.x,dude.y-56,"TAPPED AFF FU'",'#7ec850');
  pint.has=true;pint.ml=568;pint.watered=0;fetching=false;
  if(!tutDone){tutDone=true;localStorage.bs_tut='1';} /* first loop done — yer on yer ain noo */
  calloutMsg(cutBig?'SO MUCH BETTER!':'WALKED IT OFF!','#ffd23f');
  sfx('bliss');lickT=0.15;

  if(spawnLassie()&&lassies.length>=2){
    var nL=lassies.length;
    if(nL<=6)speak(['','','AW. COMPANY.',"WHAUR DAE THEY KEEP COMIN' FAE?","IT'S A FESTIVAL NOO.","THE HAIL SCHEME'S HERE.",'RIGHT. THIS IS A BEACH NOO.'][nL]);
    else if(nL>=LASS_MAX)speak("THE GAIRDEN'S FU'.");

  if(pint.has&&pint.ml>300)popup(dude.x,dude.y-40,"NO' A DROP SPILT",'#7ec850');

function updStrut(dt){
  /* he walks it off himsel — nae input needed, on the beat at 130bpm */
  var BEAT=0.4615;
  strutT+=dt;
  var beat=Math.floor(strutT/BEAT);
  if(beat>strutBeat){
    strutBeat=beat;
    if(strutBeat<=4){
      strutSteps=Math.min(4,strutSteps+1);
      score+=50;
      if(AC&&!muted)tone([392,440,523.25,659.25][(strutSteps-1)%4],AC.currentTime,0.18,'sawtooth',0.07);
      sfx('cheer');
      popup(dude.x,dude.y-58,['STEP!','AYE!','OI OI!',"STRUTTIN'!"][(strutSteps-1)%4],'#ffd23f');
      dude.x=clamp(dude.x+strutDir*10,20,W-20);dude.face=strutDir;
      for(var i=0;i<4;i++)parts.push({x:dude.x-strutDir*6,y:dude.y+10,vx:rnd(-10,10),vy:-rnd(4,14),t:0.4,life:0.4,col:'#c9bfa8',sz:1});
      for(var j=0;j<3;j++)parts.push({x:rnd(20,W-20),y:rnd(H-80,H-36),vx:0,vy:0,t:0.15,life:0.15,col:'#fff',sz:2});
    }
  }
  if(strutBeat>=5)finishStrut();
}

/* ---------- update ---------- */
function update(dt){
  T+=dt;menuT+=dt;
  if(nawT>0)nawT-=dt;
  updSong(dt);
  /* the world hauds its breath while ye're gettin' run ower an' walkin' it off */
  if(scene!=='CUT'&&scene!=='STRUT'&&scene!=='BAL'){updPatch(dt);updRain(dt);}
  if(guitarCd>0)guitarCd-=dt;
  if(shake>0)shake=Math.max(0,shake-dt*22);
  if(flashRed>0)flashRed-=dt;
  if(flashWhite>0)flashWhite-=dt;
  if(invuln>0)invuln-=dt;
  if(lickT>0){lickT-=dt;if(lickT<=0)sfx('lick');}
  blinkT-=dt;if(blinkT<0)blinkT=rnd(2,4);
  if(callout){callout.t-=dt;if(callout.t<=0)callout=null;}
  if(bubble){bubble.t-=dt;if(bubble.t<=0)bubble=null;}
  for(var i=pops.length-1;i>=0;i--){var p=pops[i];p.t-=dt;p.y-=22*dt;if(p.t<=0)pops.splice(i,1);}
  for(var j=parts.length-1;j>=0;j--){var q=parts[j];q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=60*dt;if(q.t<=0)parts.splice(j,1);}
  /* scene fade */
  if(fadeDir===1){
    fadeV+=dt*3.2;
    if(fadeV>=1){fadeV=1;switchTo(fadeNext);fadeNext=null;fadeDir=-1;}
  }else if(fadeDir===-1){
    fadeV-=dt*3.2;
    if(fadeV<=0){fadeV=0;fadeDir=0;}
  }
  if(state!=='PLAY')return;
  /* first-timer card up: the world waits */
  if(tutCard){tutCardT+=dt;return;}
  if(scene==='GARDEN'){
    updMove(dt);
    updDrink(dt);
    updLassies(dt);
  }else if(scene==='PUB')updPub(dt);
  else if(scene==='STREET')updStreet(dt);
  else if(scene==='CUT')updCut(dt);
  else if(scene==='BAL')updBal(dt);
  else if(scene==='STRUT')updStrut(dt);
}

function drawRain(){
  if(!rain.active)return;
  /* it's on everywhere — except the sun spot */
  ctx.fillStyle='rgba(60,72,95,0.22)';
  ctx.fillRect(0,40,W,H-40);
  ctx.strokeStyle='rgba(180,210,235,0.55)';ctx.lineWidth=1;
  ctx.beginPath();
  for(var i=0;i<46;i++){
    var rx=((i*47+T*90)%W),ry=40+((i*89+T*230)%(H-40));
    if(patch.alpha>0.5){
      var ddx=(rx-patch.x)/(patch.r+6),ddy=(ry-patch.y)/(patch.r*0.6+6);
      if(ddx*ddx+ddy*ddy<1)continue; /* dry in the beam */
    }
    ctx.moveTo(rx,ry);ctx.lineTo(rx-2,ry+7);
  }
  ctx.stroke();
  /* splashes aff the grass */
  if(Math.random()<0.5){
    var sx2=rnd(0,W),sy2=rnd(120,360);
    if(!(patch.alpha>0.5&&dist(sx2,sy2,patch.x,patch.y)<patch.r+6))
      parts.push({x:sx2,y:sy2,vx:rnd(-8,8),vy:-rnd(8,22),t:0.22,life:0.22,col:'#9fc9e8',sz:1});
  }
}
function drawParticles(){
  parts.forEach(function(p){
    ctx.globalAlpha=clamp(p.t/p.life,0,1);
    px(p.x,p.y,p.sz,p.sz,p.col);
  });
  ctx.globalAlpha=1;
  pops.forEach(function(p){
    ctx.globalAlpha=clamp(p.t,0,1);
    text(p.txt,p.x,p.y,7,p.col);
  });
  ctx.globalAlpha=1;
}

  text("OOT O' PINTS",W/2,88,15,'#ff6b6b');
  var s=Math.floor(score);
  var shown=Math.floor(Math.min(s,s*clamp(overT/1.2,0,1)));
  text(shown+' ml',W/2,128,22,'#ffd23f');
  text('OF BEER IN THE SUN',W/2,148,7,'#fff');
  var rank=s<800?'FAIR-WEATHER PUNTER':s<2000?'SOLID SESSIONER':s<4000?'BEER GARDEN REGULAR':s<8000?'ABSOLUTE SUN WORSHIPPER':'PURE BLISS INCARNATE';
  text('RANK:',W/2,172,7,'rgba(255,255,255,0.7)');
  text(rank,W/2,184,9,'#7ec850');
  var ln=200;
  if(walkOffs>0){text('RAN OVER x'+walkOffs+' — WALKED THEM AFF',W/2,ln,6,'#ffd23f');ln+=11;}
  if(swiftHaufs>0){text('SWIFT HAUFS SURVIVED: '+swiftHaufs,W/2,ln,6,'#6bc5ff');ln+=11;}
  if(tidyPints>0){text('TIDY PINTS POURED: '+tidyPints,W/2,ln,6,'#7ec850');ln+=11;}
  if(newBest&&Math.floor(overT*3)%2===0)text('NEW BEST!',W/2,ln+6,10,'#ffd23f');
  else text('BEST: '+hi+' ml',W/2,ln+6,8,'#fff');
  text('GO CHECK IT OUT PLEASE AND',W/2,262,7,'#cfe6f5');
  text('THANK YOU IN ADVANCE',W/2,274,7,'#cfe6f5');
  text('♡',W/2,286,9,'#7ec850');
  if(overT>0.8&&Math.floor(overT*2)%2===0)text('TAP TO GO AGAIN',W/2,314,9,'#fff');
}
function drawPause(){
  ctx.fillStyle='rgba(10,16,30,0.7)';ctx.fillRect(0,0,W,H);
  text('PAUSED',W/2,H/2-10,16,'#ffd23f');
  text('TAP TO RESUME',W/2,H/2+14,8,'#fff');
}

/* ---------- render ---------- */
function renderGarden(){
  drawGardenSky();
  drawGardenSet();
  /* y-sort: further doon the screen draws in front */
  var items=[
    {y:BINS[0].y+9,f:function(){drawBin(BINS[0].x,BINS[0].y,'#3f6b3a');}},
    {y:BINS[1].y+9,f:function(){drawBin(BINS[1].x,BINS[1].y,'#3a5a8a');}},
    {y:FLOWERS.y+8,f:drawFlowerBed},
    {y:WHIRL.y+8,f:drawWhirligig},
    {y:dude.y+11,f:drawDude}
  ];
  for(var li2=0;li2<lassies.length;li2++){
    (function(g){items.push({y:g.y+7,f:function(){drawLassie(g);}});})(lassies[li2]);
  }
  items.sort(function(a,b){return a.y-b.y;});
  for(var i=0;i<items.length;i++)items[i].f();
  drawBackFence();
  drawRain();
}
function render(){
  ctx.setTransform(RES,0,0,RES,0,0);
  if((scene==='CUT'||scene==='BAL')&&state==='PLAY'){
    if(scene==='CUT')drawCutscene();else drawBalScene();
    if(tutCard)drawTutCard();
    drawDoubleVision();
    drawScanlines();
    if(fadeV>0){ctx.fillStyle='rgba(6,10,20,'+fadeV+')';ctx.fillRect(0,0,W,H);}
    return;
  }
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake)*0.5,rnd(-shake,shake)*0.5);
  /* the drink sways the hail warld, gently, everywhere */
  var drW=state==='PLAY'?drunkLvl():0;
  if(drW>0.03){
    ctx.translate(W/2,H/2);
    ctx.rotate(Math.sin(T*0.9)*0.022*drW);
    ctx.translate(-W/2,-H/2+Math.sin(T*0.7)*2*drW);
  }
  if(scene==='GARDEN'||scene==='STRUT')renderGarden();
  else if(scene==='PUB')drawPubScene();
  else if(scene==='STREET'){drawStreetScene();drawDude();}
  drawParticles();
  ctx.restore();
  if(state==='PLAY'||state==='PAUSE')drawHUD();
  drawStrutUI();
  drawCallout();
  if(state==='PLAY'&&tutCard)drawTutCard();
  drawVignette();
  if(state==='MENU')drawMenu();
  if(state==='OVER'){overT+=dtG;drawOver();}
  if(state==='PAUSE')drawPause();
  if(fadeV>0){ctx.fillStyle='rgba(6,10,20,'+fadeV+')';ctx.fillRect(0,0,W,H);}
  drawDoubleVision();
  drawScanlines();
}

/* ---------- input ---------- */
function canvasXY(e){
  var r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  var p=canvasXY(e);
  if(p.x>W-28&&p.y<24){setMuted(!muted);return;}
  if(state==='MENU'){
    if(p.y>300&&p.y<340&&p.x>W/2-60&&p.x<W/2+60){ /* the slider kens best */
      volTries++;
      var L=['NAW!','NAW.','STILL NAW.',"IT'S AT THE RIGHT LEVEL.","PERSISTENT, AREN'T YE?",'NAW MEANS NAW.'];
      nawMsg=L[Math.min(volTries-1,L.length-1)];
      nawT=1.5;sfx('squawk');return;
    }
    start();return;
  }
  if(state==='OVER'){if(overT>0.8){state='MENU';menuT=0;}return;}
  if(state==='PAUSE'){state='PLAY';return;}
  if(state!=='PLAY')return;
  if(tutCard){if(tutCardT>0.5)tutCard=null;return;}
  if(scene==='BAL'){balPX=p.x;return;} /* touch doon anywhere — swipin' steers */
  if(scene==='CUT'||scene==='STRUT')return; /* nae skippin' the ritual */
  if(scene==='PUB'){
    if(!pour.done){
      if(!pour.hold&&pour.ml>=80&&p.x>W/2-43&&p.x<W/2+43&&p.y>314&&p.y<344){takePartial();return;}
      pour.hold=true;
    }
    return;
  }
  if(dragId!==null&&e.pointerId!==dragId){tryTap(p.x,p.y);return;}
  dragId=e.pointerId;
  pressStart=p;pressMoved=false;
  dragOff={x:dude.x-p.x,y:dude.y-p.y};
});
cv.addEventListener('pointermove',function(e){
  if(state==='PLAY'&&scene==='BAL'&&!tutCard){
    if(balPX===null)return; /* nae press, nae steer */
    var pB=canvasXY(e);
    pendCorr+=(pB.x-balPX)*1.15;
    balPX=pB.x;
    return;
  }
  if(e.pointerId!==dragId||state!=='PLAY')return;
  if(scene!=='GARDEN'&&scene!=='STREET')return;
  var p=canvasXY(e);
  if(!pressMoved&&pressStart&&dist(p.x,p.y,pressStart.x,pressStart.y)>6){pressMoved=true;dragging=true;}
  if(dragging){
    dude.tx=clamp(p.x+dragOff.x,16,W-16);
    dude.ty=clamp(p.y+dragOff.y,scene==='STREET'?80:112,H-18);
  }
});
function endPointer(e){
  balPX=null;
  if(scene==='PUB')pourRelease();
  if(e.pointerId!==dragId)return;
  if(state==='PLAY'&&!pressMoved&&pressStart&&(scene==='GARDEN'||scene==='STREET'))tryTap(pressStart.x,pressStart.y);
  dragId=null;dragging=false;pressStart=null;
}
addEventListener('pointerup',endPointer);
addEventListener('pointercancel',endPointer);
addEventListener('keydown',function(e){
  if(e.repeat)return;
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')kb.l=true;
  if(k==='ArrowRight'||k==='d'||k==='D')kb.r=true;
  if(k==='ArrowUp'||k==='w'||k==='W')kb.u=true;
  if(k==='ArrowDown'||k==='s'||k==='S')kb.d=true;
  if(e.code==='Space'){
    e.preventDefault();initAudio();
    if(state==='MENU')start();
    else if(state==='OVER'){if(overT>0.8){state='MENU';menuT=0;}}
    else if(state==='PAUSE')state='PLAY';
    else if(state==='PLAY'){
      if(tutCard){if(tutCardT>0.5)tutCard=null;}
      else if(scene==='STRUT'||scene==='CUT'){}
      else if(scene==='PUB'&&!pour.done)pour.hold=true;
      else tryTap(dude.x,dude.y-14);
    }
  }
  if(k==='m'||k==='M')setMuted(!muted);
});
addEventListener('keyup',function(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')kb.l=false;
  if(k==='ArrowRight'||k==='d'||k==='D')kb.r=false;
  if(k==='ArrowUp'||k==='w'||k==='W')kb.u=false;
  if(k==='ArrowDown'||k==='s'||k==='S')kb.d=false;
  if(e.code==='Space'&&scene==='PUB')pourRelease();
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&state==='PLAY')state='PAUSE';
});
addEventListener('blur',function(){if(state==='PLAY')state='PAUSE';});

/* ---------- main loop ---------- */
var last=0,dtG=0;
function frame(ts){
  var dt=(ts-last)/1000;last=ts;
  if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  dtG=dt;
  if(state!=='PAUSE')update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(function(ts){last=ts;requestAnimationFrame(frame);});
})();
</script>
</body>
</html>
