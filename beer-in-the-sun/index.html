function finishSwitch(){

    if(pend.pubUse)pubFresh=false; /* the first-efter-the-pub entry's been an' gane */
  }else{
    if(sunSrc){try{sunSrc.stop();}catch(e){} sunPos=pend.outPos%songBuf.duration;}
    sunSrc=null;bgSrc=pend.src;bgPos=pend.inPos;bgT0=pend.at;sunOn=false;
  }

function cancelSwitch(){

  outGain.gain.setValueAtTime(outGain.gain.value,t);

function updSong(dt){
  if(!AC||!songBuf)return;
  var t=AC.currentTime;
  if(!bgSrc&&!sunSrc&&!pend){ /* first start: the song drifts in ahint the clouds */
    bgSrc=makeSrc(false);bgPos=bgPos%songBuf.duration;
    bgSrc.start(0,bgPos);bgT0=t;
    bgGain.gain.setTargetAtTime(BG_VOL,t,0.5);
    return;
  }
  /* the freshness clock: 85% o' a chorus heard = heard. Watches the audible
     playhead across BOTH layers; a big backward jump = the sang-end wrap. */
  var ap=activePos(t);
  if(lastAudP>=0){
    if(ap>lastAudP&&ap-lastAudP<5){
      for(var zf=0;zf<3;zf++){
        var armAt=bT(CHORUS_ZONES[zf][0]+38); /* 75% o' the 50-beat section */
        if(lastAudP<armAt&&ap>=armAt)chorusEndT=t;
      }
    }else if(lastAudP-ap>60)chorusEndT=t; /* wrapped past the ootro's chorus */
  }
  if(sunOn){
    var hk=bIdx(ap);
    if(hk>=BEAT_ANCHOR&&hk<BEAT_ANCHOR+SUN_BEATS&&hk>chorusHW){chorusHW=hk;chorusHWT=t;}
  }
  lastAudP=ap;
  /* the chorus lives in the circle. A pint ye DRANK dry keeps the sun on
     across the gairden — a pint the rain RUINED earns ye naething */
  var pintDone=pint.has&&pint.ml<=0;
  var wantSun=state==='PLAY'&&scene==='GARDEN'&&pint.has&&(inSunPatch()||pintDone);
  if(pend){
    if(t>pend.at+CF+0.05)finishSwitch();
    else if(wantSun!==pend.to&&t<pend.at-0.02)cancelSwitch();
    else return;
  }
  /* sticky: quick tae bring the chorus in, gey reluctant tae let it go */
  if(sunOn&&!wantSun&&!rain.active&&scene==='GARDEN'&&patch.alpha>0.4&&dist(dude.x,dude.y,patch.x,patch.y)<patch.r+14)wantSun=true;
  if(wantSun!==sunOn){
    if(wantSun){ /* intae the sun: a wee 0.25s debounce hides under the beat-wait;
                    the pint-done trigger stays instant */
      sunHold+=dt;
      if(pintDone||sunHold>0.25){sunHold=0;scheduleSwitch(true);}
    }else{
      sunHold+=dt; /* oot the sun: hysteresis only on the wey oot */
      if(sunHold>1.0){sunHold=0;scheduleSwitch(false);}
    }
  }else sunHold=0;
  if(!sunOn&&bgSrc&&!pend)bgGain.gain.setTargetAtTime(rainOnScreen()?BG_VOL*0.5:BG_VOL,t,0.4);
  /* first full listen: when the main track rows ower its last bar, mark the occasion */
  if(!songDone&&!sunOn&&bgSrc){
    var curP=activePos(t);
    if(lastBgP>60&&curP<lastBgP-60){songDone=true;songEndPending=true;}
    lastBgP=curP;
  }
}

/* ---------- garden: the sun fighting through the clouds ---------- */
function updPatch(dt){
  var R=clamp(T/150,0,1);
  patch.r=lerp(34,24,R);
  patch.moveT-=dt;
  if(patch.moveT<=0){
    patch.tx=rnd(36,180);patch.ty=rnd(132,324);
    patch.moveT=rnd(lerp(5,3,R),lerp(8,5,R));
  }
  var sp=lerp(22,40,R);
  var dx=patch.tx-patch.x,dy=patch.ty-patch.y,d=Math.hypot(dx,dy)||1;
  if(d>2){patch.x+=dx/d*Math.min(sp,d*2)*dt;patch.y+=dy/d*Math.min(sp,d*2)*dt;}
  /* the sun is ALWAYS there — it just wanders */
  patch.alpha=Math.min(1,patch.alpha+dt*2);
}
function updRain(dt){
  /* deterministic Scotland: leave the circle -> thunder -> rain at 1s.
     step back intae the light -> sky clears. Nae randomness, nae timers. */
  /* the circle only beats the rain when ye bring it beer */
  var inSun=state==='PLAY'&&scene==='GARDEN'&&inSunPatch()&&pint.has&&pint.ml>0;
  if(inSun&&rain.active){
    rain.active=false;rain.warned=false;rainCnt=0;
    calloutMsg('SUN BEATS RAIN!','#ffd23f');sfx('twinkle');
  }
  if(inSun){rainCnt=0;wasInSun=true;}
  else if(state==='PLAY'&&scene==='GARDEN'&&tutDone){
    /* the leave-the-circle event — but rain only threatens a pint at risk */
    if(wasInSun){wasInSun=false;rainCnt=(pint.has&&pint.ml>0)?0.0001:0;rainWarnAt=0.4;}
    if(!(pint.has&&pint.ml>0))rainCnt=0;
    if(rainCnt>0&&!rain.active){
      rainCnt+=dt;
      if(rainCnt>=rainWarnAt&&!rain.warned){rain.warned=true;sfx('thunder');flashWhite=0.2;} /* thunder says it a' — nae UI notif */
      if(rainCnt>=rainWarnAt+0.6){rain.active=true;}
    }
  }
  if(rainOnScreen()){
    rainSfxT-=dt;
    if(rainSfxT<=0){rainSfxT=0.25;if(AC&&!muted)noiseBurst(AC.currentTime,0.22,0.03,1400);}
  }
}

/* ---------- cutscene + strut + bliss ---------- */
function updCut(dt){

function updBal(dt){
  /* the wind in yer ears — heavier when ye're swingin' or a gust's comin' */
  windSfxT-=dt;
  if(windSfxT<=0){
    windSfxT=0.16;
    if(AC&&!muted)noiseBurst(AC.currentTime,0.3,0.016+Math.min(0.05,Math.abs(tiltV)*0.012+(gust.warn>0?0.03:0)),900+rnd(0,700));
  }
  if(balFail){
    balFailT+=dt;
    if(balFailT>1.2){
      balFailT=-999;
      /* spilt it — right back tae the bar wi' ye */
      ruinPint('SPILT THE HAIL PINT!','SAME AGAIN THEN...');
      if(state==='PLAY')goScene('PUB');
    }
    return;
  }
  balT+=dt;
  /* the mair ye've had, the harder this gets — an' it never stops gettin' harder */
  var drunk=drunkLvl();
  /* swipes feed correction directly — nae walls, ye can ayeways steer */
  var kbMove=(kb.r?1:0)-(kb.l?1:0);
  if(kbMove)pendCorr+=kbMove*120*dt;
  var rawApply=clamp(pendCorr,-192*dt,192*dt);
  pendCorr-=rawApply;
  pendCorr*=Math.max(0,1-dt*6); /* stale swipe bleeds aff */
  /* the drunker ye are, the later yer haun answers */
  lagBuf+=rawApply;
  var apply=lagBuf*Math.min(1,dt*lerp(26,4.5,drunk));
  lagBuf-=apply;
  tiltA-=apply/60;
  tiltV*=Math.max(0,1-Math.abs(apply/60)*2); /* corrections settle the swing */
  /* he sways under it, cosmetically */
  dudeOff=clamp(dudeOff+apply*0.45,-34,34);
  dudeOff*=Math.max(0,1-dt*2.2);
  hx=108+dudeOff;
  /* liquid physics: the surface chases world-level, kicked by tilt AND by yer haun */
  var vHx=(hx-prevHx2)/Math.max(dt,0.001);
  var aHx=(vHx-prevVx2)/Math.max(dt,0.001);
  prevHx2=hx;prevVx2=vHx;
  var surfTgt=-tiltA-clamp(aHx*0.0016,-0.6,0.6);
  surfSV+=((surfTgt-surfSA)*26-surfSV*4.5)*dt;
  surfSA+=surfSV*dt;
  /* slosh ower the rim: the raised edge splashes */
  var fillN=clamp(pint.ml/568,0,1);
  var edgeUp=Math.abs(surfSA)*4.2,headroom=(1-fillN)*14;
  if(pint.has&&pint.ml>0&&edgeUp>headroom+1.2){
    var sd4=surfSA>0?-1:1;
    var ov=Math.min(pint.ml,(edgeUp-headroom)*10*dt);
    pint.ml-=ov;flightSpill+=ov;spillAcc+=ov*0.8;spillFlash=0.35;stock-=ov/568;
    var dyB2=246+Math.sin(T*2.2)*6;
    while(spillAcc>2.2){spillAcc-=2.2;
      balDrops.push({x:hx+sd4*(11+rnd(0,7)),y:dyB2-66-34+rnd(-3,5),
        vx:sd4*rnd(14,40)+vHx*0.5,vy:rnd(-30,0),t:rnd(0.6,1.0)});}
  }
  /* pint physics: it tips — get under it */
  var R=drunk;
  /* body sway — the drink's daein' its ain steerin' */
  tiltV+=Math.sin(balT*1.4+swayPh)*(0.55+0.9*drunk)*dt;
  /* hiccups */
  hicT-=dt;
  if(drunk>0.15&&hicT<=0){
    hicT=rnd(lerp(6,1.2,drunk),lerp(8,2.4,drunk));
    tiltV+=rnd(-1,1)*(0.5+drunk*0.9);
    popup(hx+rnd(-10,10),200,'*HIC*','#ffd23f');
    if(AC&&!muted)tone(rnd(500,700),AC.currentTime,0.08,'square',0.05,900);
    shake=Math.max(shake,2);
  }
  /* ambient turbulence — it's aye daein' somethin' */
  turbT-=dt;
  if(turbT<=0){turbT=rnd(0.4,0.75);tiltV+=rnd(-1,1)*lerp(0.55,1.25,R);}
  /* pow curve: lively near level (yer instinct fires), flattens near the brink */
  var aa=Math.abs(tiltA);
  tiltV+=(tiltA>0?1:tiltA<0?-1:0)*0.6*Math.pow(aa,0.55)*lerp(2.1,3.3,R)*dt;
  tiltV*=Math.max(0,1-dt*0.45);
  /* gusts, telegraphed */
  if(gust.warn>0){
    gust.warn-=dt;
    if(gust.warn<=0){tiltV+=gust.dir*gust.power;sfx('whoosh');}
  }else{
    gust.t-=dt;
    if(gust.t<=0){
      gust.warn=0.5;gust.dir=Math.random()<0.5?-1:1;
      gust.power=lerp(1.0,2.9,R)*rnd(0.8,1.2);
      gust.t=rnd(1.4,2.4);
    }
  }
  tiltA+=tiltV*dt;
  if(!tutDone)tiltA=clamp(tiltA,-0.8,0.8); /* safe first run — cannae tip past the brink */
  tiltA=clamp(tiltA,-1.15,1.15);
  if(Math.abs(tiltA)>0.55&&Math.random()<dt*8)sfx('spill');
  /* gradual spillage: no' spill-or-nae-spill — the further ower, the mair comes oot */
  var aa2=Math.abs(tiltA);
  if(aa2>0.45&&pint.has&&pint.ml>0){
    var sRate=lerp(8,90,Math.pow((aa2-0.45)/0.7,1.4));
    var out=Math.min(pint.ml,sRate*dt);
    pint.ml-=out;flightSpill+=out;spillAcc+=out;spillFlash=0.35;stock-=out/568;
    var sd3=tiltA>0?1:-1,dyB=246+Math.sin(T*2.2)*6;
    while(spillAcc>2.2){
      spillAcc-=2.2;
      balDrops.push({x:hx+sd3*(13+rnd(0,9)),y:dyB-66-34+rnd(-4,6),
        vx:sd3*rnd(18,55)+tiltV*25,vy:rnd(-25,5),t:rnd(0.7,1.1)});
    }
    if(pint.ml<=0&&!balFail){ /* dribbled the hail thing awa — that's a life */
      stock=Math.max(0,Math.floor(stock-1e-6)); /* the rest o' the icon gangs wi' it */
      balFail=true;balFailT=0;
      sfx('splash');shake=6;
      calloutMsg("DRIBBLED IT A' AWA!",'#ff5252');
      speak('AW NAW...');
    }
  }
  for(var bd=balDrops.length-1;bd>=0;bd--){
    var D=balDrops[bd];D.t-=dt;D.vy+=330*dt;D.x+=D.vx*dt;D.y+=D.vy*dt;
    if(D.t<=0||D.y>H-40)balDrops.splice(bd,1);
  }
  /* the brink: it hings there pourin' — 2 seconds tae save it */
  if(Math.abs(tiltA)>0.92){
    brinkT+=dt;
    if(pint.ml>0)pint.ml=Math.max(0,pint.ml-45*dt);
    if(Math.random()<dt*6)sfx('spill');
    if(brinkT>=0.4){
      /* droppin' the pint taks the rest o' the icon wi' it — at least a life */
      stock=Math.max(0,Math.min(Math.floor(stock-1e-6),stock-pint.ml/568));
      balFail=true;balFailT=0;pint.ml=0;
      sfx('splash');shake=6;
      calloutMsg('SPILT IT!!','#ff5252');
      speak('NAW NAW NAW—');
      return;
    }
  }else brinkT=Math.max(0,brinkT-dt*1.5);
  if(balT>=BAL_LEN){
    /* hame, pint intact — noo the strut */
    walkOffs++;score+=100;
    scene='STRUT';
    dude.x=108;dude.y=250;dude.tx=108;dude.ty=250;
    strutT=0;strutBeat=0;strutSteps=0;
    strutDir=1;
    for(var i=0;i<8;i++)parts.push({x:dude.x+rnd(-10,10),y:dude.y+12,vx:rnd(-20,20),vy:-rnd(5,20),t:0.5,life:0.5,col:'#c9bfa8',sz:1});
    if(flightSpill<5)popup(dude.x,dude.y-44,"NO' A DROP SPILT +100",'#7ec850');
    else popup(dude.x,dude.y-44,Math.round(pint.ml)+"ml LANDED",'#ffd23f');
    calloutMsg('NOO WALK IT OFF!','#ffd23f');
    sfx('cheer');
  }
}
function finishStrut(){

  rain.active=false;rain.warned=false;wasInSun=false;rainCnt=0.0001;rainWarnAt=1.0;

  if(pint.has&&pint.ml<560)popup(dude.x,dude.y-56,"TAPPED AFF FU'",'#7ec850');

    else if(nL>=LASS_MAX)speak("THE GAIRDEN'S FU'.");

function updStrut(dt){
  /* he walks it off himsel — nae input needed, on the beat at 130bpm */
  var BEAT=0.4615;
  strutT+=dt;
  var beat=Math.floor(strutT/BEAT);
  if(beat>strutBeat){
    strutBeat=beat;
    if(strutBeat<=4){
      strutSteps=Math.min(4,strutSteps+1);
      score+=50;
      if(AC&&!muted)tone([392,440,523.25,659.25][(strutSteps-1)%4],AC.currentTime,0.18,'sawtooth',0.07);
      sfx('cheer');
      popup(dude.x,dude.y-58,['STEP!','AYE!','OI OI!',"STRUTTIN'!"][(strutSteps-1)%4],'#ffd23f');
      dude.x=clamp(dude.x+strutDir*10,20,W-20);dude.face=strutDir;
      for(var i=0;i<4;i++)parts.push({x:dude.x-strutDir*6,y:dude.y+10,vx:rnd(-10,10),vy:-rnd(4,14),t:0.4,life:0.4,col:'#c9bfa8',sz:1});
      for(var j=0;j<3;j++)parts.push({x:rnd(20,W-20),y:rnd(H-80,H-36),vx:0,vy:0,t:0.15,life:0.15,col:'#fff',sz:2});
    }
  }
  if(strutBeat>=5)finishStrut();
}

/* ---------- update ---------- */
function update(dt){
  T+=dt;menuT+=dt;
  if(nawT>0)nawT-=dt;
  if(spillFlash>0)spillFlash-=dt;
  if(state==='PLAY'&&stock<=0){stock=0;sfx('lose');calloutMsg("THAT'S THE LOT GONE",'#ff6b6b');gameOver();}
  updSong(dt);
  /* bliss follows the chorus: sight an' sound move thegither */
  if(songEndPending&&state==='PLAY'&&(scene==='GARDEN'||scene==='STREET'||scene==='PUB')){
    songEndPending=false;
    lbAdd(Math.floor(score));sfx('cheer');
    namePendingScore=Math.floor(score);
    if(namePendingScore>=300){nameBuf=(localStorage.bs_name||'');nameNext='SONGEND';state='NAME';}
    else state='SONGEND';
  }
  var bt=(sunOn&&state==='PLAY'&&(scene==='GARDEN'||scene==='STRUT')&&pint.has&&pint.ml>0)?1:0;
  blissV+=(bt-blissV)*Math.min(1,dt*3);
  if(blissV>0.4&&(scene==='GARDEN'||scene==='STRUT')&&Math.random()<dt*20*blissV){
    var _a=Math.random()*TAU,_r=Math.sqrt(Math.random())*patch.r;
    parts.push({x:patch.x+Math.cos(_a)*_r,y:patch.y+Math.sin(_a)*_r*0.6,vx:rnd(-3,3),vy:-rnd(8,20),t:rnd(0.6,1.1),life:1.1,col:Math.random()<0.5?'#ffe98a':'#fff6c8',sz:1});
  }
  /* the world hauds its breath while ye're gettin' run ower an' walkin' it off */
  if(scene!=='CUT'&&scene!=='STRUT'&&scene!=='BAL'){updPatch(dt);updRain(dt);}
  if(guitarCd>0)guitarCd-=dt;
  if(shake>0)shake=Math.max(0,shake-dt*22);
  if(flashRed>0)flashRed-=dt;
  if(flashWhite>0)flashWhite-=dt;
  if(invuln>0)invuln-=dt;
  if(lickT>0){lickT-=dt;if(lickT<=0)sfx('lick');}
  blinkT-=dt;if(blinkT<0)blinkT=rnd(2,4);
  if(callout){callout.t-=dt;if(callout.t<=0)callout=null;}
  if(bubble){bubble.t-=dt;if(bubble.t<=0)bubble=null;}
  for(var i=pops.length-1;i>=0;i--){var p=pops[i];p.t-=dt;p.y-=22*dt;if(p.t<=0)pops.splice(i,1);}
  for(var j=parts.length-1;j>=0;j--){var q=parts[j];q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=60*dt;if(q.t<=0)parts.splice(j,1);}
  /* scene fade */
  if(fadeDir===1){
    fadeV+=dt*3.2;
    if(fadeV>=1){fadeV=1;switchTo(fadeNext);fadeNext=null;fadeDir=-1;}
  }else if(fadeDir===-1){
    fadeV-=dt*3.2;
    if(fadeV<=0){fadeV=0;fadeDir=0;}
  }
  if(state!=='PLAY')return;
  /* first-timer card up: the world waits */
  if(tutCard){tutCardT+=dt;return;}
  if(scene==='GARDEN'){
    updMove(dt);
    updDrink(dt);
    updLassies(dt);
  }else if(scene==='PUB')updPub(dt);
  else if(scene==='STREET')updStreet(dt);
  else if(scene==='CUT')updCut(dt);
  else if(scene==='BAL')updBal(dt);
  else if(scene==='STRUT')updStrut(dt);
}

/* ---------- garden drawing ---------- */
function gapX(){return clamp(patch.x,36,180);}
function beatPulse(){ /* 1 on each TRUE beat o' the audible track, decayin' — for the bliss VFX */
  if(blissV<=0.02)return 0;
  var ph;
  if(AC&&songBuf){
    var p=activePos(AC.currentTime),i=bIdx(p),b0=bT(i),b1=bT(i+1);
    ph=b1>b0?clamp((p-b0)/(b1-b0),0,1):0;
  }else ph=(T*(129.2/60))%1;
  return blissV*Math.pow(1-ph,3);
}
function drawGardenSky(){
  var gloom=rainOnScreen()?0.5:0.15;

      ctx.translate(Math.sin(T*6)*2.2*blissV,-Math.abs(Math.sin(T*12))*2.2*blissV);

      for(var i2=0;i2<8;i2++){ctx.rotate(TAU/8+0.39);ctx.fillRect(15,-1,8,2);}
      ctx.restore();
    }
    ctx.beginPath();ctx.arc(0,0,10+blissV*2,0,TAU);ctx.fill();
    var ang=Math.atan2(dude.y-28,dude.x-gx);

      ctx.fillStyle='#1c1c22';
      ctx.fillRect(-7,-4,6,4);ctx.fillRect(1,-4,6,4);
      ctx.fillRect(-1,-3,2,1);
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillRect(-6,-4,2,1);ctx.fillRect(2,-4,2,1);
      ctx.strokeStyle='#7a5510';ctx.lineWidth=1.5;

      if(wink)ctx.fillRect(-5,-2,4,1);else ctx.fillRect(-5+Math.cos(ang),-3+Math.sin(ang),2,3);
      ctx.fillRect(2+Math.cos(ang),-3+Math.sin(ang),2,3);

  drawCloudDeck(20,'#c3cbd6',gx,gapHalf,7,gloom);

function drawRain(){
  if(!rain.active)return;
  /* it's on everywhere — except the sun spot */
  ctx.fillStyle='rgba(60,72,95,0.22)';
  ctx.fillRect(0,40,W,H-40);
  /* nae rain in the ray: solid drops ootside the beam, faint anes in the feathered edge */
  var beamOn=patch.alpha>0.15,py2=patch.y;
  function beamF(rx,ry){ /* 0 at the beam's centreline, 1 at its edge */
    if(!beamOn||ry>py2)return 99;
    var tt=(ry-40)/(py2-40);if(tt<0)return 99;
    var cx3=gapX()+(patch.x-gapX())*tt;
    var hw=(13+(patch.r*0.85-13)*tt)*patch.alpha;
    if(hw<=0)return 99;
    return Math.abs(rx-cx3)/hw;
  }
  ctx.lineWidth=1;
  var passes=[['rgba(180,210,235,0.55)',2],['rgba(180,210,235,0.2)',1]];
  for(var p2=0;p2<2;p2++){
    ctx.strokeStyle=passes[p2][0];
    ctx.beginPath();
    for(var i=0;i<46;i++){
      var rx=((i*47+T*90)%W),ry=40+((i*89+T*230)%(H-40));
      if(patch.alpha>0.5){
        var ddx=(rx-patch.x)/(patch.r+6),ddy=(ry-patch.y)/(patch.r*0.6+6);
        if(ddx*ddx+ddy*ddy<1)continue; /* dry in the pool */
      }
      var f=beamF(rx,ry);
      var zone=f<0.85?0:(f<1.25?1:2); /* core / feather / ootside */
      if(zone!==passes[p2][1])continue;
      ctx.moveTo(rx,ry);ctx.lineTo(rx-2,ry+7);
    }
    ctx.stroke();
  }
  /* splashes aff the grass */
  if(Math.random()<0.5){
    var sx2=rnd(0,W),sy2=rnd(120,360);
    if(!(patch.alpha>0.5&&dist(sx2,sy2,patch.x,patch.y)<patch.r+6))
      parts.push({x:sx2,y:sy2,vx:rnd(-8,8),vy:-rnd(8,22),t:0.22,life:0.22,col:'#9fc9e8',sz:1});
  }
}
function drawParticles(){
  parts.forEach(function(p){
    ctx.globalAlpha=clamp(p.t/p.life,0,1);
    px(p.x,p.y,p.sz,p.sz,p.col);
  });
  ctx.globalAlpha=1;
  pops.forEach(function(p){
    ctx.globalAlpha=clamp(p.t,0,1);
    text(p.txt,p.x,p.y,7,p.col);
  });
  ctx.globalAlpha=1;
}

function drawEdinburgh(hz){
  /* faurest back: the Pentlands, saft an' pale, rollin' by slow */
  var hph=balT*5;
  ctx.fillStyle='#93a9bf';
  ctx.beginPath();ctx.moveTo(-10,H);ctx.lineTo(-10,hz-8);
  for(var px2=-10;px2<=W+10;px2+=8){
    var hy=hz-10-11*Math.abs(Math.sin((px2+hph)*0.019))-5*Math.sin((px2+hph)*0.057);
    ctx.lineTo(px2,hy);
  }
  ctx.lineTo(W+10,H);ctx.closePath();ctx.fill();
  /* the toun spread alang their fit — grund at last */
  var ccyc=W*3,coff=(balT*11)%ccyc;
  ctx.fillStyle='#7d92aa';
  ctx.fillRect(-10,hz-1,W+20,H-hz+2);
  for(var ck=-1;ck<2;ck++){
    var cb=ck*ccyc-coff;
    for(var bi=0;bi<38;bi++){
      var bx=cb+bi*17+((bi*7)%9);
      var bh=3+((bi*13)%7);
      ctx.fillRect(bx,hz-1-bh,9+((bi*5)%6),bh+2);
      if(bi%9===4)ctx.fillRect(bx+3,hz-6-bh,1.5,5); /* a spire here an' there */
    }
  }
  /* lit windaes doon in the toun */
  ctx.fillStyle='rgba(255,223,138,0.4)';
  for(var wk=-1;wk<2;wk++){
    var wb=wk*ccyc-coff;
    for(var wi=0;wi<26;wi++)ctx.fillRect(wb+wi*25+((wi*11)%13),hz+2+((wi*7)%8),1,1);
  }
  /* slow parallax skyline: the Castle, Arthur's Seat, the Scott Monument, Calton Hill */
  var cyc=W*2.6,off=(balT*16)%cyc;
  ctx.fillStyle='#6f849c';
  for(var k=-1;k<2;k++){
    var b=k*cyc-off;
    /* Arthur's Seat */
    var ax=b+34;
    ctx.beginPath();ctx.moveTo(ax-42,hz);ctx.quadraticCurveTo(ax-6,hz-46,ax+18,hz-30);
    ctx.quadraticCurveTo(ax+34,hz-20,ax+48,hz);ctx.closePath();ctx.fill();
    /* the Castle on its rock */
    var cx3=b+190;
    ctx.beginPath();ctx.moveTo(cx3-36,hz);ctx.quadraticCurveTo(cx3-24,hz-24,cx3-8,hz-27);
    ctx.lineTo(cx3+28,hz-27);ctx.lineTo(cx3+34,hz);ctx.closePath();ctx.fill();
    ctx.fillRect(cx3-6,hz-40,26,14);
    for(var cr=0;cr<5;cr++)ctx.fillRect(cx3-6+cr*6,hz-43,3,4);
    ctx.fillRect(cx3+4,hz-52,1.5,9);
    ctx.fillStyle='#3a6bb5';ctx.fillRect(cx3+5.5,hz-52,6,4);
    ctx.strokeStyle='#fff';ctx.lineWidth=0.6;
    ctx.beginPath();ctx.moveTo(cx3+5.5,hz-52);ctx.lineTo(cx3+11.5,hz-48);
    ctx.moveTo(cx3+11.5,hz-52);ctx.lineTo(cx3+5.5,hz-48);ctx.stroke();
    ctx.fillStyle='#6f849c';
    /* the Scott Monument */
    var sx4=b+340;
    ctx.beginPath();ctx.moveTo(sx4-10,hz);ctx.lineTo(sx4-4,hz-42);ctx.lineTo(sx4,hz-58);
    ctx.lineTo(sx4+4,hz-42);ctx.lineTo(sx4+10,hz);ctx.closePath();ctx.fill();
    ctx.fillRect(sx4-13,hz-16,26,3);
    ctx.fillRect(sx4-9,hz-30,18,2);
    /* Calton Hill + the columns */
    var kx=b+470;
    ctx.beginPath();ctx.moveTo(kx-38,hz);ctx.quadraticCurveTo(kx,hz-22,kx+38,hz);ctx.closePath();ctx.fill();
    for(var co=0;co<5;co++)ctx.fillRect(kx-15+co*7,hz-32,3,13);

function canvasXY(e){
  var r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  var p=canvasXY(e);
  if(p.x>W-28&&p.y<24){setMuted(!muted);return;}
  if(state==='MENU'){
    if(p.y>312&&p.y<340&&p.x>W/2-60&&p.x<W/2+60){ /* the slider kens best */
      volTries++;
      var L=['NAW!','NAW.','STILL NAW.',"IT'S AT THE RIGHT LEVEL.","PERSISTENT, AREN'T YE?",'NAW MEANS NAW.'];
      nawMsg=L[Math.min(volTries-1,L.length-1)];
      nawT=1.5;sfx('squawk');return;
    }
    if(p.y>284&&p.y<300){ /* the world's tap pints */
      boardFetch();state='BOARD';return;
    }
    if(p.y>347&&p.y<369){ /* stream the real thing */
      try{window.open('https://open.spotify.com/track/4gxDGM8LNht9higommwH7h','_blank');}catch(e){}
      return;
    }
    start();return;
  }
  if(state==='OVER'){if(overT>0.8){state='MENU';menuT=0;}return;}
  if(state==='PAUSE'){state='PLAY';return;}
  if(state==='SONGEND'){state='PLAY';return;}
  if(state==='BOARD'){state='MENU';menuT=0;return;}
  if(state==='NAME'){
    var gx0=9,gy0=176,cw=22,chh2=24;
    if(p.y>gy0&&p.y<gy0+3*chh2){
      var c=Math.floor((p.x-gx0)/cw),r=Math.floor((p.y-gy0)/chh2);
      if(c>=0&&c<9&&r>=0&&r<3){
        var L2=NAME_ROWS[r][c];
        if(L2&&nameBuf.length<10){nameBuf+=L2;sfx('pickup');}
      }
      return;
    }
    if(p.y>254&&p.y<280){
      if(p.x>9&&p.x<69){nameBuf=nameBuf.slice(0,-1);sfx('spill');return;}
      if(p.x>81&&p.x<135){nameEnd(false);return;}
      if(p.x>141&&p.x<207){nameEnd(true);return;}
    }
    return;
  }
  if(state!=='PLAY')return;
  if(tutCard){if(tutCardT>0.5)tutCard=null;return;}
  if(scene==='BAL'){balPX=p.x;return;} /* touch doon anywhere — swipin' steers */
  if(scene==='CUT'||scene==='STRUT')return; /* nae skippin' the ritual */
  if(scene==='PUB'){
    if(!pour.done){
      if(!pour.hold&&pour.ml>=80&&p.x>W/2-43&&p.x<W/2+43&&p.y>314&&p.y<344){takePartial();return;}
      pour.hold=true;
    }
    return;
  }
  if(dragId!==null&&e.pointerId!==dragId){tryTap(p.x,p.y);return;}
  dragId=e.pointerId;
  pressStart=p;pressMoved=false;
  dragOff={x:dude.x-p.x,y:dude.y-p.y};
});
cv.addEventListener('pointermove',function(e){
  if(state==='PLAY'&&scene==='BAL'&&!tutCard){

});

addEventListener('keydown',function(e){
  if(e.repeat)return;
  var k=e.key;
  if(state==='NAME'){ /* type yer name like it's 1989 */
    if(/^[a-zA-Z ]$/.test(k)&&nameBuf.length<10){nameBuf+=k.toUpperCase();sfx('pickup');}
    else if(k==='Backspace')nameBuf=nameBuf.slice(0,-1);
    else if(k==='Enter')nameEnd(true);
    else if(k==='Escape')nameEnd(false);
    e.preventDefault();return;
  }
  if(state==='BOARD'){state='MENU';menuT=0;return;}
  if(k==='ArrowLeft'||k==='a'||k==='A')kb.l=true;
  if(k==='ArrowRight'||k==='d'||k==='D')kb.r=true;
  if(k==='ArrowUp'||k==='w'||k==='W')kb.u=true;
  if(k==='ArrowDown'||k==='s'||k==='S')kb.d=true;
  if(e.code==='Space'){
    e.preventDefault();initAudio();
    if(state==='MENU')start();
    else if(state==='OVER'){if(overT>0.8){state='MENU';menuT=0;}}
    else if(state==='PAUSE')state='PLAY';
    else if(state==='SONGEND')state='PLAY';
    else if(state==='PLAY'){
      if(tutCard){if(tutCardT>0.5)tutCard=null;}
      else if(scene==='STRUT'||scene==='CUT'){}
      else if(scene==='PUB'&&!pour.done)pour.hold=true;
      else tryTap(dude.x,dude.y-14);
    }
  }
  if(k==='m'||k==='M')setMuted(!muted);
});
addEventListener('keyup',function(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')kb.l=false;
  if(k==='ArrowRight'||k==='d'||k==='D')kb.r=false;
  if(k==='ArrowUp'||k==='w'||k==='W')kb.u=false;
  if(k==='ArrowDown'||k==='s'||k==='S')kb.d=false;
  if(e.code==='Space'&&scene==='PUB')pourRelease();
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&state==='PLAY')state='PAUSE';
});
addEventListener('blur',function(){if(state==='PLAY')state='PAUSE';});

/* ---------- main loop ---------- */
var last=0,dtG=0;
function frame(ts){
  var dt=(ts-last)/1000;last=ts;
  if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  dtG=dt;
  if(state!=='PAUSE'&&state!=='SONGEND'&&state!=='NAME'&&state!=='BOARD')update(dt);
  else updSong(dt); /* paused/menus = back tae the main track, gently */
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(function(ts){last=ts;requestAnimationFrame(frame);});
})();
</script>
</body>
